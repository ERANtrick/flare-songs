<!DOCTYPE html>
<html lang="ja" data-bs-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSSより前にテーマを復元し、初期表示の色の切替を抑える。 -->
  <script id="theme-init">
    (() => {
      let theme;
      try { theme = localStorage.getItem('flare-songs:theme:v1'); } catch (_) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <title>不知火フレア 歌枠＆MV 一覧サイト | Jump to Flare’s Live & MVs</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="description" content="不知火フレアさんのYouTube歌枠やMVを頭出しリンク付きで一覧化。Jump to Flare’s Live & MVsで好みの楽曲へすぐアクセス！" />
  <meta name="keywords" content="不知火フレア, ホロライブ, 歌枠, MV, Flare Songs, Hololive" />
  <meta property="og:title" content="不知火フレア 歌枠＆MV一覧" />
  <meta property="og:description" content="不知火フレアさんの歌配信を頭出しリンク付きでまとめたファンサイト。" />
  <meta property="og:url" content="https://erantrick.github.io/flare-songs/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TS8J82429K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TS8J82429K');
  </script>
</head>

<body>
  <div class="container py-4">
    <h1 class="mb-2 text-center">
      不知火フレア 歌枠＆MV 一覧サイト<br />
      <small class="text-muted">Jump to Flare’s Live &amp; MVs</small>
    </h1>

    <!-- 言語切替 -->
    <div class="text-end mb-3 d-flex justify-content-end align-items-center gap-2">
      <button id="dark-mode-btn" type="button" class="nav-link">ダークモード</button>
      <span> | </span>
      <label for="lang-select" class="form-label small mb-0" id="lang-label">言語</label>
      <select id="lang-select" class="form-select form-select-sm w-auto d-inline">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
    
    <!-- おまかせで1曲（検索条件とは独立した抽選） -->
    <section id="surprise-area" class="surprise-area mb-4" aria-labelledby="surprise-heading">
      <div class="surprise-controls">
        <h2 id="surprise-heading">おまかせで1曲</h2>
        <div class="surprise-category-field">
          <label for="surprise-category" id="surprise-category-label" class="form-label small">カテゴリ</label>
          <select id="surprise-category" class="form-select form-select-sm">
            <option value="all">すべて</option>
            <option value="mv">MV・カバー曲</option>
            <option value="singing">歌枠</option>
            <option value="live">3Dライブ・配信</option>
          </select>
        </div>
        <button id="surprise-pick" type="button" class="btn btn-primary surprise-action" disabled
          aria-controls="surprise-result" aria-expanded="false">
          <img class="surprise-icon" src="assets/icons/shuffle.svg" alt="" aria-hidden="true">
          <span data-surprise-label="pick">1曲選ぶ</span>
        </button>
      </div>
      <p id="surprise-status" class="small text-body-secondary mb-0 mt-2" role="status">曲データを読み込み中です…</p>
      <div id="surprise-result" class="surprise-result" role="region" aria-labelledby="surprise-song-title" hidden>
        <div class="surprise-artwork" hidden>
          <img id="surprise-thumbnail" alt="" loading="lazy" referrerpolicy="no-referrer">
        </div>
        <div class="surprise-details">
          <h3 id="surprise-song-title" aria-live="polite" aria-atomic="true"></h3>
          <div class="surprise-meta">
            <span id="surprise-date" class="text-body-secondary" hidden></span>
            <span id="surprise-song-category" class="badge text-bg-secondary" hidden></span>
          </div>
          <p id="surprise-session" class="text-body-secondary" hidden></p>
          <div class="surprise-actions">
            <a id="surprise-play" class="btn btn-primary surprise-action" target="_blank" rel="noopener noreferrer">
              <img class="surprise-icon" src="assets/icons/play-fill.svg" alt="" aria-hidden="true">
              <span data-surprise-label="listen">YouTubeで聴く</span>
            </a>
            <button id="surprise-favorite" type="button" class="btn btn-outline-secondary surprise-action" aria-pressed="false">
              <span class="surprise-star" aria-hidden="true">☆</span>
              <span data-surprise-label="favorite">お気に入りに登録</span>
            </button>
            <button id="surprise-history" type="button" class="btn btn-outline-primary surprise-action" hidden>
              <img class="surprise-icon" src="assets/icons/music-note-list.svg" alt="" aria-hidden="true">
              <span data-surprise-label="history">この曲の歌唱履歴を見る</span>
            </button>
            <button id="surprise-again" type="button" class="btn btn-secondary surprise-action">
              <img class="surprise-icon" src="assets/icons/shuffle.svg" alt="" aria-hidden="true">
              <span data-surprise-label="again">別の曲を選ぶ</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- フィルタバー -->
    <div class="mb-4 filter-bar">
      <div class="filter-item">
        <label for="mode-select" class="form-label small">表示モード</label>
        <select id="mode-select" class="form-select form-select-sm">
          <option value="session">配信枠一覧</option>
          <option value="song">曲名一覧</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="session-select" class="form-label small">配信を選択</label>
        <select id="session-select" class="form-select form-select-sm">
          <option value="">すべての配信</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="category-select" class="form-label small">カテゴリ</label>
        <select id="category-select" class="form-select form-select-sm">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="sort-session" class="form-label small">並び順</label>
        <select id="sort-session" class="form-select form-select-sm"></select>
      </div>
      <div class="filter-item keyword">
        <label for="search-input" class="form-label small">曲名で絞り込み</label>
        <input type="text" id="search-input" class="form-control form-control-sm" placeholder="キーワード..." />
      </div>
      <div class="filter-item reset">
        <label class="form-label small invisible">リセット</label>
        <button id="reset-btn" class="btn btn-outline-secondary btn-sm">リセット</button>
      </div>
      <div class="filter-item fav-toggle">
        <label class="form-label small invisible">お気に入り</label>
        <button id="fav-only-btn" class="btn btn-outline-warning btn-sm">★ お気に入りだけ表示</button>
      </div>
    </div>

    <!-- リストエリア -->
    <p id="data-notice" class="small text-body-secondary" role="status" hidden></p>
    <div id="song-list" class="accordion"></div>
    <div id="scroll-anchor" style="height: 1px;" aria-hidden="true"></div>
    <button id="load-more-btn" type="button" class="btn btn-outline-secondary" aria-controls="song-list" hidden>さらに表示</button>
  </div>

  <!-- Bootstrap JS & 自作JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js" defer></script>

  <!-- フッター -->
  <footer class="text-center text-muted mt-5 py-3 border-top small">
    <p>このサイトは <a href="https://x.com/eran_trick" target="_blank">ERAN🔥</a> によって作成・運営されています。</p>
    <p>ご意見・ご要望などありましたらお気軽にご連絡ください。</p>
  </footer>
</body>
</html>
