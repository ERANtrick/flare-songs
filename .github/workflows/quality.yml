name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-regression:
    name: Fixed regression and Pages exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: _maintenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: _maintenance/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
          working-directory: _maintenance
      - run: npm run test:pages
      - name: Upload current run summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _maintenance/artifacts/*/run.json
            _maintenance/artifacts/*/unit.xml
            _maintenance/artifacts/*/playwright.xml
            _maintenance/artifacts/*/pages/*-build.json
            _maintenance/artifacts/*/pages/comparison.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload current failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: _maintenance/artifacts/
          if-no-files-found: warn
          retention-days: 7
